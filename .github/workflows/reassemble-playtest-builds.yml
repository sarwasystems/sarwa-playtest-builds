name: Reassemble Playtest Builds

on:
  push:
    branches: [main]
    paths:
      - '.binary-chunks/**'
      - '.github/workflows/reassemble-playtest-builds.yml'
      - '.reassemble-trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified ZIPs
        shell: bash
        run: |
          set -euo pipefail
          decode_parts() {
            src="$1"; out="$2"
            mkdir -p "$(dirname "$out")"
            : > "$out"
            for f in "$src"/*.b64; do
              base64 --decode "$f" >> "$out"
            done
          }
          decode_parts .binary-chunks/nokia games/NOKIA-MAN/NOKIA-MAN-NATIVE-R01-Windows-x64.zip
          decode_parts .binary-chunks/osteo games/Osteophage/Osteophage-Native-v0.4.0-Windows-x86_64.zip
          decode_parts .binary-chunks/graham games/Graham-Mas-Cookie-Castle/GrahamMasCookieCastle-R01-Playable.zip
          decode_parts .binary-chunks/heck games/MAKE-ME-SCARED-Heckville-High/MAKE_ME_SCARED_Heckville_High_R03_2_Nick_Roger.zip
          echo 'e442b964cb67c57a9f3d736a7eaefbf410f453518b4dce70df9dfec740423ef4  games/NOKIA-MAN/NOKIA-MAN-NATIVE-R01-Windows-x64.zip' | sha256sum -c -
          echo 'a01d4936ac62576f49ca1487ceb7558483d879758833bef7dde4aed247df601a  games/Osteophage/Osteophage-Native-v0.4.0-Windows-x86_64.zip' | sha256sum -c -
          echo 'c3b7a0d6aa451a97506d0b5053ffc040fd418230568032a574485f057844852f  games/Graham-Mas-Cookie-Castle/GrahamMasCookieCastle-R01-Playable.zip' | sha256sum -c -
          echo '3bad0d5bfa7e2a9c66485afe1112e1ff8a71164684a73ee54a77db1592a51593  games/MAKE-ME-SCARED-Heckville-High/MAKE_ME_SCARED_Heckville_High_R03_2_Nick_Roger.zip' | sha256sum -c -
      - name: Commit reconstructed builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sarwasystems-buildbot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/NOKIA-MAN/NOKIA-MAN-NATIVE-R01-Windows-x64.zip \
                  games/Osteophage/Osteophage-Native-v0.4.0-Windows-x86_64.zip \
                  games/Graham-Mas-Cookie-Castle/GrahamMasCookieCastle-R01-Playable.zip \
                  games/MAKE-ME-SCARED-Heckville-High/MAKE_ME_SCARED_Heckville_High_R03_2_Nick_Roger.zip
          if git diff --cached --quiet; then
            echo 'Builds already match.'
          else
            git commit -m 'Publish verified playable builds [skip ci]'
            git push
          fi
